  変数名・関数名提案ツール

  更新日: 2026-08-16

-->
<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>変数名・関数名提案ツール</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet">
  <style>
    /* デザインシステム定義 */
    :root {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --accent: #00b0f0;
      --accent-gradient: linear-gradient(135deg, #00b0f0 0%, #1d72b8 100%);
      --accent-light: #e0f2fe;
      --card-border: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ダークモード定義 */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #0b0f19;
        --bg-secondary: #161b26;
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #64748b;
        --accent-light: #0c4a6e;
        --card-border: #222b3c;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.5);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.3), 0 2px 4px -2px rgb(0 0 0 / 0.3);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4), 0 4px 6px -4px rgb(0 0 0 / 0.4);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: var(--transition);
    }

    .container {
      width: 100%;
      max-width: 1080px;
      margin: auto;
    }

    /* ヘッダーデザイン */
    header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: var(--accent-gradient);
      color: white;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 16px;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }

    .logo-container::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transform: rotate(45deg);
      animation: shine 4s infinite linear;
    }

    @keyframes shine {
      0% {
        transform: translate(-50%, -50%) rotate(45deg);
      }

      100% {
        transform: translate(50%, 50%) rotate(45deg);
      }
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      max-width: 540px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* メインカード */
    .card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: var(--shadow-lg);
      transition: var(--transition);
      margin-bottom: 24px;
    }

    /* モード選択トグルスイッチ */
    .mode-selector-wrapper {
      margin-bottom: 24px;
    }

    .mode-selector-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: block;
    }

    .mode-segmented-control {
      display: flex;
      background-color: var(--bg-primary);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
    }

    .mode-option {
      flex: 1;
      text-align: center;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: var(--transition);
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .mode-option input[type="radio"] {
      display: none;
    }

    .mode-option.active {
      background: var(--accent-gradient);
      color: white;
      box-shadow: var(--shadow-sm);
    }

    .form-group {
      margin-bottom: 24px;
      position: relative;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="text"] {
      width: 100%;
      padding: 16px 20px;
      font-size: 16px;
      border: 2px solid var(--card-border);
      border-radius: 12px;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      outline: none;
      transition: var(--transition);
      font-family: var(--font-sans);
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(0, 176, 240, 0.15);
    }

    /* 提案実行ボタン */
    button.submit-btn {
      width: 100%;
      max-width: 320px;
      margin: 8px auto 0;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      background: var(--accent-gradient);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button.submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px -4px rgba(0, 176, 240, 0.3);
    }

    button.submit-btn:active {
      transform: translateY(0);
    }

    /* ローディング表示 */
    .loading-container {
      display: none;
      text-align: center;
      padding: 24px 0;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--card-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* エラー表示 */
    .error-container {
      display: none;
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 14px;
      line-height: 1.5;
    }

    /* 結果表示エリア */
    .results-container {
      display: none;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .results-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    /* 各提案カード */
    .suggestion-card {
      background-color: var(--bg-primary);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 10px;
      transition: var(--transition);
      position: relative;
    }

    .suggestion-card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-sm);
    }

    /* 変数表示エリア */
    .variable-code-container {
      display: flex;
      align-items: center;
      background-color: var(--bg-secondary);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 14px;
      position: relative;
    }

    .variable-code {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      overflow-x: auto;
      white-space: nowrap;
      flex-grow: 1;
      padding-right: 48px;
    }

    /* コピーボタン */
    .copy-btn {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: 6px;
      color: var(--text-muted);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .copy-btn:hover {
      background-color: var(--bg-primary);
      color: var(--accent);
    }

    .copy-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .copy-tooltip {
      position: absolute;
      right: 12px;
      top: -24px;
      background-color: var(--text-primary);
      color: var(--bg-secondary);
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .copy-tooltip.show {
      opacity: 0.9;
    }

    /* フッター */
    footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 24px;
    }

    /* アプリケーションレイアウト（左右2カラム） */
    .app-layout {
      display: flex;
      gap: 24px;
      width: 100%;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .input-card {
      flex: 5;
      min-width: 320px;
      margin-bottom: 0;
      padding: 24px;
    }

    .results-card {
      flex: 7;
      min-height: 480px;
      margin-bottom: 0;
      display: flex;
      flex-direction: column;
    }

    /* プレースホルダー（結果未生成時） */
    .placeholder-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 64px 24px;
      color: var(--text-muted);
      flex-grow: 1;
    }

    .placeholder-icon {
      font-size: 56px;
      margin-bottom: 20px;
      opacity: 0.5;
      animation: pulse 3s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.4;
        transform: scale(1);
      }
      50% {
        opacity: 0.7;
        transform: scale(1.05);
      }
    }

    .placeholder-text {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.6;
      max-width: 320px;
    }

    /* レスポンシブ（モバイル環境） */
    @media (max-width: 820px) {
      .app-layout {
        flex-direction: column;
        gap: 20px;
      }

      .input-card,
      .results-card {
        width: 100%;
        flex: none;
      }

      .results-card {
        min-height: auto;
      }

      .placeholder-container {
        padding: 40px 16px;
      }
    }

    /* タイプごとのグループ分け */
    .type-group {
      margin-bottom: 20px;
      border-bottom: 1px dashed var(--card-border);
      padding-bottom: 14px;
    }

    .type-group:last-child {
      margin-bottom: 0;
      border-bottom: none;
      padding-bottom: 0;
    }

    .type-group-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    @media (prefers-color-scheme: dark) {
      .type-group-title {
        color: #38bdf8;
      }
    }

    .type-group-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 16px;
      background: var(--accent-gradient);
      border-radius: 2px;
    }
  </style>
</head>

<body>

  <div class="container">
    <header>
      <div class="logo-container">{}</div>
      <h1>変数名・関数名提案ツール</h1>
      <p class="subtitle">日本語の指示を入力すると、GASやVBA、JavaScriptなどで使える直感的な変数名・関数名を提案します。</p>
    </header>

    <div class="app-layout">
      <!-- 左カラム: 入力フォーム -->
      <div class="card input-card">
        <form id="translateForm" onsubmit="handleSubmit(event)">

          <!-- 生成モード選択 -->
          <div class="mode-selector-wrapper">
            <span class="mode-selector-label">生成モードの選択</span>
            <div class="mode-segmented-control">
              <label class="mode-option active" id="modeVarLabel">
                <input type="radio" name="targetMode" value="variable" checked onchange="handleModeChange('variable')">
                <span>📦 変数名</span>
              </label>
              <label class="mode-option" id="modeFuncLabel">
                <input type="radio" name="targetMode" value="function" onchange="handleModeChange('function')">
                <span>⚡ 関数名</span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label id="inputLabel" for="jpInput">変数に入れたい役割・内容（日本語）</label>
            <div class="input-wrapper">
              <input type="text" id="jpInput" placeholder="例：スプレッドシートの最終行、アクティブなシート、件名" required autocomplete="off">
            </div>
          </div>

          <button type="submit" class="submit-btn">
            <span id="submitBtnText">英語の変数名を生成する</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>
      </div>

      <!-- 右カラム: 提案結果 -->
      <div class="card results-card">
        <!-- 初期状態プレースホルダー -->
        <div id="placeholder" class="placeholder-container">
          <div class="placeholder-icon">🔍</div>
          <div class="placeholder-text">左側のフォームに入力して生成ボタンを押すと、ここに結果が表示されます。</div>
        </div>

        <!-- ローディング -->
        <div id="loading" class="loading-container">
          <div class="spinner"></div>
          <div class="loading-text">用語辞書とGoogle翻訳で最適な名前を考えています...</div>
        </div>

        <!-- エラー表示 -->
        <div id="errorMessage" class="error-container"></div>

        <!-- 結果表示エリア -->
        <div id="results" class="results-container">
          <h2 id="resultsTitle" class="results-title">提案された変数名</h2>
          <div id="suggestionsList"></div>
        </div>
      </div>
    </div>

    <footer>
      ノンプロ研 サポートツール by kiri
    </footer>
  </div>

  <script>
    let currentMode = 'variable';

    /**
     * モード切り替え処理
     */
    function handleModeChange(mode) {
      currentMode = mode;

      const varLabel = document.getElementById('modeVarLabel');
      const funcLabel = document.getElementById('modeFuncLabel');
      const inputLabel = document.getElementById('inputLabel');
      const inputElement = document.getElementById('jpInput');
      const submitBtnText = document.getElementById('submitBtnText');

      if (mode === 'function') {
        varLabel.classList.remove('active');
        funcLabel.classList.add('active');
        inputLabel.textContent = '関数にさせたい処理・動作（日本語）';
        inputElement.placeholder = '例：シート名を取得する、メールを送信する、データ更新';
        submitBtnText.textContent = '英語の関数名を生成する';
      } else {
        funcLabel.classList.remove('active');
        varLabel.classList.add('active');
        inputLabel.textContent = '変数に入れたい役割・内容（日本語）';
        inputElement.placeholder = '例：スプレッドシートの最終行、アクティブなシート、件名';
        submitBtnText.textContent = '英語の変数名を生成する';
      }
    }

    /**
     * フォーム送信時の処理
     */
    function handleSubmit(event) {
      event.preventDefault();

      const inputElement = document.getElementById('jpInput');
      const query = inputElement.value.trim();
      if (!query) return;

      // 表示の初期化
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('loading').style.display = 'block';
      document.getElementById('results').style.display = 'none';
      document.getElementById('errorMessage').style.display = 'none';

      // サーバーサイド関数呼び出し (GAS環境)
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(onSuccess)
          .withFailureHandler(onFailure)
          .suggestVariableName(query, currentMode);
      } else {
        // ローカル開発・検証用のモック挙動
        setTimeout(function () {
          const mockResult = getMockResult(query, currentMode);
          onSuccess(mockResult);
        }, 800);
      }
    }

    /**
     * 成功時のコールバック
     */
    function onSuccess(result) {
      document.getElementById('loading').style.display = 'none';

      if (result.success) {
        const resultsTitle = document.getElementById('resultsTitle');
        resultsTitle.textContent = (result.mode === 'function') ? '提案された関数名' : '提案された変数名';

        const suggestionsList = document.getElementById('suggestionsList');
        suggestionsList.innerHTML = '';

        const resultsArray = Array.isArray(result.results)
          ? result.results
          : Object.values(result.results);

        resultsArray.forEach(function (typeData) {
          const groupDiv = document.createElement('div');
          groupDiv.className = 'type-group';

          const title = document.createElement('h3');
          title.className = 'type-group-title';
          title.textContent = typeData.label;
          groupDiv.appendChild(title);

          const listDiv = document.createElement('div');
          listDiv.className = 'type-suggestions-list';

          typeData.suggestions.forEach(function (item) {
            const card = createSuggestionCard(item);
            listDiv.appendChild(card);
          });

          groupDiv.appendChild(listDiv);
          suggestionsList.appendChild(groupDiv);
        });

        document.getElementById('results').style.display = 'block';
      } else {
        showError(result.error);
      }
    }

    /**
     * 失敗時のコールバック
     */
    function onFailure(error) {
      document.getElementById('loading').style.display = 'none';
      showError(error.message || 'サーバーとの通信中にエラーが発生しました。');
    }

    /**
     * エラーメッセージの表示
     */
    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
    }

    /**
     * 提案カードHTML要素を作成
     */
    function createSuggestionCard(item) {
      const card = document.createElement('div');
      card.className = 'suggestion-card';

      const codeContainer = document.createElement('div');
      codeContainer.className = 'variable-code-container';

      const codeElement = document.createElement('div');
      codeElement.className = 'variable-code';
      codeElement.textContent = item.name;
      codeContainer.appendChild(codeElement);

      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.title = 'クリップボードにコピー';
      copyBtn.innerHTML = `
        <svg viewBox="0 0 24 24">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      `;

      const tooltip = document.createElement('span');
      tooltip.className = 'copy-tooltip';
      tooltip.textContent = 'Copied!';
      codeContainer.appendChild(tooltip);

      const textToCopy = item.name;

      copyBtn.onclick = function () {
        copyToClipboard(textToCopy, tooltip);
      };

      codeContainer.appendChild(copyBtn);
      card.appendChild(codeContainer);

      return card;
    }

    /**
     * クリップボードコピー処理
     */
    function copyToClipboard(text, tooltipElement) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          showTooltip(tooltipElement);
        }).catch(function () {
          fallbackCopyToClipboard(text, tooltipElement);
        });
      } else {
        fallbackCopyToClipboard(text, tooltipElement);
      }
    }

    /**
     * 古いブラウザ向けのフォールバックコピー処理
     */
    function fallbackCopyToClipboard(text, tooltipElement) {
      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.position = 'fixed';
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        showTooltip(tooltipElement);
      } catch (err) {
        console.error('コピーできませんでした: ', err);
      }
      document.body.removeChild(textArea);
    }

    /**
     * ツールチップの一時表示
     */
    function showTooltip(tooltipElement) {
      tooltipElement.classList.add('show');
      setTimeout(function () {
        tooltipElement.classList.remove('show');
      }, 1500);
    }

    /**
     * ローカル環境デバッグ用モック結果生成
     */
    function getMockResult(query, mode) {
      const isFunction = (mode === 'function');
      let rawNames = [];

      if (isFunction) {
        if (query.includes('取得')) {
          rawNames = ['getSheetName', 'getName'];
        } else if (query.includes('送信')) {
          rawNames = ['sendEmail', 'sendMail'];
        } else {
          rawNames = ['doProcess'];
        }

        const types = [
          { id: 'func_standard', label: '通常関数 (Verb + Noun)' },
          { id: 'func_boolean', label: 'Boolean判定関数 (is... / has...)' },
          { id: 'func_handler', label: 'イベントハンドラ (on... / handle...)' },
          { id: 'func_private', label: '内部・ヘルパー関数 (_... / fetch...)' }
        ];

        const resultsList = types.map(function (t) {
          const suggestions = rawNames.map(function (name) {
            let resName = name;
            if (t.id === 'func_boolean') resName = 'is' + name.charAt(0).toUpperCase() + name.slice(1);
            if (t.id === 'func_handler') resName = 'on' + name.charAt(0).toUpperCase() + name.slice(1);
            if (t.id === 'func_private') resName = '_' + name;
            return { name: resName };
          });

          return { id: t.id, label: t.label, suggestions: suggestions };
        });

        return { success: true, mode: mode, originalText: query, results: resultsList };
      } else {
        if (query.includes('スプレッドシート') && query.includes('最終行')) {
          rawNames = ['lastRow', 'spreadsheetLastRow'];
        } else {
          rawNames = ['sheetName'];
        }

        const types = [
          { id: 'variable', label: '通常変数' },
          { id: 'boolean', label: 'Boolean (真偽値)' },
          { id: 'array', label: '配列・リスト' },
          { id: 'constant_snake', label: '定数 (SNAKE)' }
        ];

        const resultsList = types.map(function (t) {
          const suggestions = rawNames.map(function (name) {
            let resName = name;
            if (t.id === 'constant_snake') resName = name.toUpperCase();
            if (t.id === 'array') resName = name + 's';
            if (t.id === 'boolean') resName = 'has' + name.charAt(0).toUpperCase() + name.slice(1);
            return { name: resName };
          });

          return { id: t.id, label: t.label, suggestions: suggestions };
        });

        return { success: true, mode: mode, originalText: query, results: resultsList };
      }
    }
  </script>
