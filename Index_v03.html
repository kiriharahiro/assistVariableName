<!--
  GAS変数名提案ツール
  Version: v_03 (凍結版 / Stable Release)
  更新日: 2026-08-15
  ノンプロ研 初心者GAS講座 サポートツール
-->
<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAS変数名提案ツール</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet">
  <style>
    /* デザインシステム定義 */
    :root {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --accent: #00b0f0;
      /* ノンプロ研カラーの薄いブルー */
      --accent-gradient: linear-gradient(135deg, #00b0f0 0%, #1d72b8 100%);
      --accent-light: #e0f2fe;
      --card-border: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --badge-rec-bg: #d1fae5;
      --badge-rec-text: #065f46;
      --badge-std-bg: #dbeafe;
      --badge-std-text: #1e40af;
      --badge-detail-bg: #f3e8ff;
      --badge-detail-text: #6b21a8;
      --badge-fallback-bg: #fee2e2;
      --badge-fallback-text: #991b1b;
      --radius: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ダークモード定義 */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #0b0f19;
        --bg-secondary: #161b26;
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #64748b;
        --accent-light: #0c4a6e;
        --card-border: #222b3c;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.5);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.3), 0 2px 4px -2px rgb(0 0 0 / 0.3);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.4), 0 4px 6px -4px rgb(0 0 0 / 0.4);
        --badge-rec-bg: #064e3b;
        --badge-rec-text: #a7f3d0;
        --badge-std-bg: #1e3a8a;
        --badge-std-text: #bfdbfe;
        --badge-detail-bg: #581c87;
        --badge-detail-text: #e9d5ff;
        --badge-fallback-bg: #7f1d1d;
        --badge-fallback-text: #fecaca;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: var(--transition);
    }

    .container {
      width: 100%;
      max-width: 1080px;
      margin: auto;
    }

    /* ヘッダーデザイン */
    header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: var(--accent-gradient);
      color: white;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 16px;
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }

    .logo-container::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transform: rotate(45deg);
      animation: shine 4s infinite linear;
    }

    @keyframes shine {
      0% {
        transform: translate(-50%, -50%) rotate(45deg);
      }

      100% {
        transform: translate(50%, 50%) rotate(45deg);
      }
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* メインカード */
    .card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: var(--shadow-lg);
      transition: var(--transition);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 24px;
      position: relative;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="text"] {
      width: 100%;
      padding: 16px 20px;
      font-size: 16px;
      border: 2px solid var(--card-border);
      border-radius: 12px;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      outline: none;
      transition: var(--transition);
      font-family: var(--font-sans);
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(0, 176, 240, 0.15);
    }

    /* 提案実行ボタン */
    button.submit-btn {
      width: 100%;
      max-width: 320px;
      margin: 8px auto 0;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      background: var(--accent-gradient);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button.submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px -4px rgba(0, 176, 240, 0.3);
    }

    button.submit-btn:active {
      transform: translateY(0);
    }

    /* ローディング表示 */
    .loading-container {
      display: none;
      text-align: center;
      padding: 24px 0;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--card-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* エラー表示 */
    .error-container {
      display: none;
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      font-size: 14px;
      line-height: 1.5;
    }

    /* 結果表示エリア */
    .results-container {
      display: none;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .results-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    /* 各提案カード */
    .suggestion-card {
      background-color: var(--bg-primary);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .suggestion-card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-rec {
      background-color: var(--badge-rec-bg);
      color: var(--badge-rec-text);
    }

    .badge-std {
      background-color: var(--badge-std-bg);
      color: var(--badge-std-text);
    }

    .badge-detail {
      background-color: var(--badge-detail-bg);
      color: var(--badge-detail-text);
    }

    .badge-fallback {
      background-color: var(--badge-fallback-bg);
      color: var(--badge-fallback-text);
    }

    /* 変数表示エリア */
    .variable-code-container {
      display: flex;
      align-items: center;
      background-color: var(--bg-secondary);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 10px;
      position: relative;
    }

    .variable-code {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      overflow-x: auto;
      white-space: nowrap;
      flex-grow: 1;
      padding-right: 48px;
    }

    .variable-prefix {
      color: #3b82f6;
      margin-right: 6px;
      font-weight: 400;
    }

    /* コピーボタン */
    .copy-btn {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: 6px;
      color: var(--text-muted);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .copy-btn:hover {
      background-color: var(--bg-primary);
      color: var(--accent);
    }

    .copy-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .copy-tooltip {
      position: absolute;
      right: 12px;
      top: -24px;
      background-color: var(--text-primary);
      color: var(--bg-secondary);
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .copy-tooltip.show {
      opacity: 0.9;
    }

    /* 提案理由 */
    .reason-text {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* フッター */
    footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 24px;
    }

    footer a {
      color: var(--text-muted);
      text-decoration: underline;
      transition: var(--transition);
    }

    footer a:hover {
      color: var(--accent);
    }

    /* 変数タイプセレクター */
    .type-selector-group {
      margin-bottom: 24px;
    }

    .type-selector {
      display: flex;
      flex-direction: column;
      background-color: var(--bg-primary);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
      transition: var(--transition);
    }

    .type-option {
      position: relative;
      cursor: pointer;
    }

    .type-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .type-label {
      display: block;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      border-radius: 8px;
      transition: var(--transition);
      user-select: none;
      text-align: left;
    }

    .type-option input[type="radio"]:checked+.type-label {
      background-color: var(--bg-secondary);
      color: var(--accent);
      box-shadow: var(--shadow-sm);
    }

    /* ダークモード時の微調整 */
    @media (prefers-color-scheme: dark) {
      .type-option input[type="radio"]:checked+.type-label {
        background-color: #222b3c;
        color: #38bdf8;
      }
    }

    /* アプリケーションレイアウト（左右2カラム） */
    .app-layout {
      display: flex;
      gap: 24px;
      width: 100%;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .input-card {
      flex: 5;
      min-width: 320px;
      margin-bottom: 0;
      padding: 24px;
    }

    .results-card {
      flex: 7;
      min-height: 480px;
      margin-bottom: 0;
      display: flex;
      flex-direction: column;
    }

    /* プレースホルダー（結果未生成時） */
    .placeholder-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 64px 24px;
      color: var(--text-muted);
      flex-grow: 1;
    }

    .placeholder-icon {
      font-size: 56px;
      margin-bottom: 20px;
      opacity: 0.5;
      animation: pulse 3s infinite ease-in-out;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.4;
        transform: scale(1);
      }

      50% {
        opacity: 0.7;
        transform: scale(1.05);
      }
    }

    .placeholder-text {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.6;
      max-width: 320px;
    }

    /* レスポンシブ（モバイル環境） */
    @media (max-width: 820px) {
      .app-layout {
        flex-direction: column;
        gap: 20px;
      }

      .input-card,
      .results-card {
        width: 100%;
        flex: none;
      }

      .results-card {
        min-height: auto;
      }

      .placeholder-container {
        padding: 40px 16px;
      }
    }

    /* タイプごとのグループ分け */
    .type-group {
      margin-bottom: 24px;
      border-bottom: 1px dashed var(--card-border);
      padding-bottom: 18px;
    }

    .type-group:last-child {
      margin-bottom: 0;
      border-bottom: none;
      padding-bottom: 0;
    }

    .type-group-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ダークモード時のタイトル色調整 */
    @media (prefers-color-scheme: dark) {
      .type-group-title {
        color: #38bdf8;
      }
    }

    .type-group-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 16px;
      background: var(--accent-gradient);
      border-radius: 2px;
    }

    /* 候補カードを少しコンパクトに調整 */
    .suggestion-card {
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .suggestion-card:last-child {
      margin-bottom: 0;
    }

    .card-header {
      margin-bottom: 8px;
    }
  </style>
</head>

<body>

  <div class="container">
    <header>
      <div class="logo-container">{}</div>
      <h1>GAS変数名提案ツール</h1>
      <p class="subtitle">日本語の変数名を入力すると、GAS（JavaScript）のキャメルケース規則に則った直感的で使いやすい変数名を提案します。</p>
    </header>

    <div class="app-layout">
      <!-- 左カラム: 入力フォーム -->
      <div class="card input-card">
        <form id="translateForm" onsubmit="handleSubmit(event)">
          <div class="form-group">
            <label for="jpInput">変数に入れたい役割・内容（日本語）</label>
            <div class="input-wrapper">
              <input type="text" id="jpInput" placeholder="例：スプレッドシートの最終行、アクティブなシート、件名" required autocomplete="off">
            </div>
          </div>

          <button type="submit" class="submit-btn">
            <span>英語の変数名を生成する</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>
      </div>

      <!-- 右カラム: 提案結果 -->
      <div class="card results-card">
        <!-- 初期状態プレースホルダー -->
        <div id="placeholder" class="placeholder-container">
          <div class="placeholder-icon">🔍</div>
          <div class="placeholder-text">左側のフォームに入力して生成ボタンを押すと、ここに結果が表示されます。</div>
        </div>

        <!-- ローディング -->
        <div id="loading" class="loading-container">
          <div class="spinner"></div>
          <div class="loading-text">GASの辞書とGoogle翻訳で最適な変数名を考えています...</div>
        </div>

        <!-- エラー表示 -->
        <div id="errorMessage" class="error-container"></div>

        <!-- 結果表示エリア -->
        <div id="results" class="results-container">
          <h2 class="results-title">提案された変数名</h2>
          <div id="suggestionsList"></div>
        </div>
      </div>
    </div>

    <footer>
      ノンプロ研 初心者GAS講座 サポートツール by kiri
    </footer>
  </div>

  <script>
    /**
     * フォーム送信時の処理
     */
    function handleSubmit(event) {
      event.preventDefault();

      const inputElement = document.getElementById('jpInput');
      const query = inputElement.value.trim();
      if (!query) return;

      // 表示の初期化
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('loading').style.display = 'block';
      document.getElementById('results').style.display = 'none';
      document.getElementById('errorMessage').style.display = 'none';

      // サーバーサイド関数呼び出し (GAS環境)
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(onSuccess)
          .withFailureHandler(onFailure)
          .suggestVariableName(query);
      } else {
        // ローカル開発・検証用のモック挙動
        setTimeout(function () {
          const mockResult = getMockResult(query);
          onSuccess(mockResult);
        }, 800);
      }
    }

    /**
     * 成功時のコールバック
     */
    function onSuccess(result) {
      document.getElementById('loading').style.display = 'none';

      if (result.success) {
        const suggestionsList = document.getElementById('suggestionsList');
        suggestionsList.innerHTML = '';

        // 各変数タイプごとにグループ化して順序通りに表示
        const resultsArray = Array.isArray(result.results)
          ? result.results
          : Object.values(result.results);

        resultsArray.forEach(function (typeData) {
          const groupDiv = document.createElement('div');
          groupDiv.className = 'type-group';

          const title = document.createElement('h3');
          title.className = 'type-group-title';
          title.textContent = typeData.label;
          groupDiv.appendChild(title);

          const listDiv = document.createElement('div');
          listDiv.className = 'type-suggestions-list';

          typeData.suggestions.forEach(function (item) {
            const card = createSuggestionCard(item, typeData.prefix);
            listDiv.appendChild(card);
          });

          groupDiv.appendChild(listDiv);
          suggestionsList.appendChild(groupDiv);
        });

        document.getElementById('results').style.display = 'block';
      } else {
        showError(result.error);
      }
    }

    /**
     * 失敗時のコールバック
     */
    function onFailure(error) {
      document.getElementById('loading').style.display = 'none';
      showError(error.message || 'サーバーとの通信中にエラーが発生しました。');
    }

    /**
     * エラーメッセージの表示
     */
    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
    }

    /**
     * バッジのクラス名を取得
     */
    function getBadgeClass(type) {
      if (type.includes('推奨')) return 'badge-rec';
      if (type.includes('標準')) return 'badge-std';
      if (type.includes('説明')) return 'badge-detail';
      return 'badge-fallback';
    }

    /**
     * 提案カードHTML要素を作成
     */
    function createSuggestionCard(item, prefix) {
      const card = document.createElement('div');
      card.className = 'suggestion-card';

      // ヘッダー (分類バッジ)
      const header = document.createElement('div');
      header.className = 'card-header';
      const badge = document.createElement('span');
      badge.className = `badge ${getBadgeClass(item.type)}`;
      badge.textContent = item.type;
      header.appendChild(badge);
      card.appendChild(header);

      // コード表示部
      const codeContainer = document.createElement('div');
      codeContainer.className = 'variable-code-container';

      const codeElement = document.createElement('div');
      codeElement.className = 'variable-code';

      // プレフィックス (const / let) の付与
      const prefixSpan = document.createElement('span');
      prefixSpan.className = 'variable-prefix';
      prefixSpan.textContent = prefix;
      codeElement.appendChild(prefixSpan);
      codeElement.appendChild(document.createTextNode(' ' + item.name)); // 半角スペースを挟んで変数名を表示
      codeContainer.appendChild(codeElement);

      // コピーボタン
      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.title = 'クリップボードにコピー';
      copyBtn.innerHTML = `
        <svg viewBox="0 0 24 24">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      `;

      // コピーツールチップ
      const tooltip = document.createElement('span');
      tooltip.className = 'copy-tooltip';
      tooltip.textContent = 'Copied!';
      codeContainer.appendChild(tooltip);

      // コピーするテキストはプレフィックスを含める (例: "const lastRow")
      const textToCopy = prefix + ' ' + item.name;

      copyBtn.onclick = function () {
        copyToClipboard(textToCopy, tooltip);
      };

      codeContainer.appendChild(copyBtn);
      card.appendChild(codeContainer);

      // 説明
      const reason = document.createElement('div');
      reason.className = 'reason-text';
      reason.textContent = item.reason;
      card.appendChild(reason);

      return card;
    }

    /**
     * クリップボードコピー処理
     */
    function copyToClipboard(text, tooltipElement) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          showTooltip(tooltipElement);
        }).catch(function () {
          fallbackCopyToClipboard(text, tooltipElement);
        });
      } else {
        fallbackCopyToClipboard(text, tooltipElement);
      }
    }

    /**
     * 古いブラウザ向けのフォールバックコピー処理
     */
    function fallbackCopyToClipboard(text, tooltipElement) {
      const textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.position = 'fixed'; // 画面外に配置
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        showTooltip(tooltipElement);
      } catch (err) {
        console.error('コピーできませんでした: ', err);
      }
      document.body.removeChild(textArea);
    }

    /**
     * ツールチップの一時表示
     */
    function showTooltip(tooltipElement) {
      tooltipElement.classList.add('show');
      setTimeout(function () {
        tooltipElement.classList.remove('show');
      }, 1500);
    }

    /**
     * ローカル環境デバッグ用モック結果生成
     */
    function getMockResult(query) {
      // ローカルブラウザでダブルクリックして開いた時の簡易モック
      const clean = query.replace(/[のをおにはとでから]/g, ' ').replace(/\s+/g, ' ').trim();
      let rawSuggestions = [];

      if (query.includes('スプレッドシート') && query.includes('最終行')) {
        rawSuggestions = [
          { name: 'lastRow', type: '推奨（GAS慣習）', reason: 'GASで一般的に使われる、シンプルで直感的な名前です。' },
          { name: 'spreadsheetLastRow', type: '標準的', reason: '言葉の意味をそのままキャメルケースにした名前です。' }
        ];
      } else if (query.includes('アクティブなシート')) {
        rawSuggestions = [
          { name: 'sheet', type: '推奨（GAS慣習）', reason: 'GASで一般的に使われる、シンプルで直感的な名前です。' },
          { name: 'activeSheet', type: '標準的', reason: '言葉の意味をそのままキャメルケースにした名前です。' }
        ];
      } else {
        // 簡易キャメルケース化モック
        const fakeName = clean.split(' ').map(function (w, i) {
          return i === 0 ? 'variable' : 'Name';
        }).join('');
        rawSuggestions = [
          { name: fakeName, type: '標準的', reason: `ローカル検証用モック結果です。入力: ${query}` }
        ];
      }

      // 各変数タイプごとの候補リストを作成
      const types = [
        { id: 'variable_const', label: '通常変数 (const)', prefix: 'const' },
        { id: 'variable_let', label: '通常変数 (let)', prefix: 'let' },
        { id: 'boolean', label: 'Boolean (真偽値)', prefix: 'let' },
        { id: 'array', label: '配列・リスト', prefix: 'const' },
        { id: 'constant_snake', label: '定数 (SNAKE)', prefix: 'const' }
      ];

      const resultsList = [];

      types.forEach(function (t) {
        const suggestions = rawSuggestions.map(function (item) {
          const transformedName = applyMockVarTypeRules(item.name, t.id, query);
          let transformedReason = item.reason;
          if (t.id === 'constant_snake') {
            transformedReason += '（定数として大文字スネークケースに変換されました）';
          } else if (t.id === 'variable_const') {
            transformedReason += '（const宣言の通常変数として提案されました）';
          } else if (t.id === 'variable_let') {
            transformedReason += '（let宣言の通常変数として提案されました）';
          } else if (t.id === 'array') {
            transformedReason += '（配列・リストとして複数形に変換されました）';
          } else if (t.id === 'boolean') {
            transformedReason += '（真偽値として is/has プレフィックスが付与されました）';
          }
          return {
            name: transformedName,
            type: item.type,
            reason: transformedReason
          };
        });

        resultsList.push({
          id: t.id,
          label: t.label,
          prefix: t.prefix,
          suggestions: suggestions
        });
      });

      return {
        success: true,
        originalText: query,
        results: resultsList
      };
    }

    /**
     * ローカルモック用の変数タイプ別変換
     */
    function applyMockVarTypeRules(name, type, query) {
      if (!name) return '';
      if (type === 'constant_snake') {
        // 簡易的な大文字スネークケース変換
        return name.replace(/([A-Z])/g, '_$1').toUpperCase().replace(/^_/, '');
      } else if (type === 'array') {
        // 簡易的な複数形変換
        if (name === 'ss') return 'ss'; // ssはそのまま
        if (name.endsWith('y') && !['a', 'e', 'i', 'o', 'u'].includes(name.charAt(name.length - 2))) {
          return name.slice(0, -1) + 'ies';
        }
        if (name.endsWith('s')) return name;
        return name + 's';
      } else if (type === 'boolean') {
        // 簡易的なBoolean変換
        const isHas = /[ある持含存在得]/.test(query) || ['data', 'value', 'error', 'file'].some(function (w) {
          return name.toLowerCase().includes(w);
        });
        const prefix = isHas ? 'has' : 'is';
        return prefix + name.charAt(0).toUpperCase() + name.slice(1);
      }
      return name; // variable_const, variable_let はそのまま
    }
  </script>
